function tone(f,d,type,vol,slide,delay){

function detectPitch(buf,sr){
  const N=buf.length;

  for(let i=0;i<N;i++)mean+=buf[i];

  let e=0;
  for(let i=0;i<N;i++){const v=buf[i]-mean;e+=v*v;}
  const rms=Math.sqrt(e/N);
  
  // Seuil RMS abaissé à 0.0018 pour détecter les voix douces sans les filtrer
  if(rms<.0018)return{f:-1,rms};
  
  const minLag=Math.max(2,Math.floor(sr/1000));

  for(let tau=1;tau<=maxLag;tau++){
    let sum=0;

    if(cm[tau]<.35&&cm[tau]<=cm[tau+1]){
      while(tau+1<maxLag&&cm[tau+1]<cm[tau])tau++;
      found=tau;break;
    }
  }
  if(found<0){
    let best=.45;
    for(let tau=minLag;tau<=maxLag;tau++){
      if(cm[tau]<best){best=cm[tau];found=tau;}
    }
  }
  if(found<0)return{f:-1,rms};
  const a=cm[Math.max(1,found-1)],b=cm[found],c=cm[Math.min(maxLag,found+1)];

}

  }else{
    bird.vy=Math.min(bird.vy+g*dt+ay*dt,maxF);bird.y+=bird.vy*dt;
    if(bird.y<BIRD_R){bird.y=BIRD_R;bird.vy=P.bounce?Math.abs(bird.vy)*.6:Math.max(bird.vy,0);}
    if(bird.y+BIRD_R>=GY){
      if(P.bounce){bird.y=GY-BIRD_R;if(bird.vy>1.5){bird.vy=-bird.vy*.72;sfx.bounce();burst(bird.x,GY-2,6,'dust',1.6);}else bird.vy=0;}
      else{bird.y=GY-BIRD_R;return die();}
    }
  }

  if(pipes.length===0||pipes[pipes.length-1].x<LW+30-P.spacing)spawnPipe();
  for(const p of pipes){
    p.x-=sp*dt;
    if(p.moving){p.ph+=P.moveSpd*dt;p.c=p.base+Math.sin(p.ph)*p.amp;}
    if(!p.scored&&p.x+p.w/2<BIRD_X){
      p.scored=true;
      if(!p.skipped){
        score++;
        const el=$('score');el.textContent=score;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
        sfx.score();burst(BIRD_X+20,bird.y,6,'star',1.6);
      }
      if(P.accel>0&&score>0&&score%P.accel===0){
        const step={1:.03,5:.07,10:.12,15:.18}[P.accel]||.1;
        speedMul=Math.min(2.5,speedMul+step);toast(tr('speed_up',{n:speedMul.toFixed(2)}));
        const b=$('speedBadge');b.textContent='⏩ ×'+speedMul.toFixed(2);b.style.display='block';
      }
      skyTarget=score/15;
    }
    const top=p.c-p.gap/2,bot=p.c+p.gap/2;
    if(!p.cleared&&(circleRect(bird.x,bird.y,BIRD_R,p.x,-50,p.w,top+50)||circleRect(bird.x,bird.y,BIRD_R,p.x,bot,p.w,GY-bot)))return die();
  }
  pipes=pipes.filter(p=>p.x+p.w+40>0);

  if(type==='vent'||type==='rafales'||type==='turbo'){if(Math.random()<.5*k*dt)addPart('wind',LW+10,rand(40,GY-20),-rand(5,8),rand(-.4,.4));}
  if(type==='lune'&&Math.random()<.3*k*dt)addPart('star',rand(0,LW),GY-10,0,-rand(.4,1),{g:0});
}

function update(dt){
  time+=dt;updateParts(dt);
  shake=Math.max(0,shake-dt*.8);flash=Math.max(0,flash-dt*.06);
  nightK=nightKCalc();
  skyPos+=(skyTarget-skyPos)*(1-Math.pow(.985,dt));
  bird.wingPh+=dt*(.28+bird.boost*.55);bird.boost=Math.max(0,bird.boost-dt*.04);bird.sq=Math.max(0,bird.sq-dt*.12);
  bird.blinkT-=dt;if(bird.blinkT<-6)bird.blinkT=rand(100,220);
  let sp=0;
  if(state==='menu'||state==='ready'){
    sp=1;
    if(state==='menu'){bird.x=LW/2;bird.y=205+Math.sin(time*.06)*8;bird.rot=Math.sin(time*.06)*.12;skyTarget=0;}
    else{
      bird.x=BIRD_X;
      if(mode==='sing'){
        const inp=singInput(dt);
        if(inp.act){bird.y=lerp(bird.y,midiToY(inp.m),1-Math.pow(.72,dt));voiceReady+=dt;bird.mouth=lerp(bird.mouth,.7,.3);if(voiceReady>10)beginPlay();}
        else{voiceReady=0;bird.y=lerp(bird.y,LH*.45+Math.sin(time*.07)*6,.1);bird.mouth=lerp(bird.mouth,0,.3);}
        bird.rot=0;
      }else{bird.y=LH*.45+Math.sin(time*.1)*7;bird.rot=Math.sin(time*.1)*.1;}
    }
  }else if(state==='play'){
    updatePlay(dt);sp=curSp;
    if(state==='play'){
      const tr2=mode==='sing'?clamp(bird.vy*.04,-.35,.35):clamp(bird.vy*.07,-.5,1.2);
      bird.rot=lerp(bird.rot,tr2,1-Math.pow(.75,dt));
    }
  }else if(state==='dying'){
    dyingT+=dt;bird.vy=Math.min(bird.vy+.5*dt,14);bird.y+=bird.vy*dt;bird.rot+=bird.spin*dt*3;
    if(bird.y>=GY-BIRD_R){bird.y=GY-BIRD_R;if(Math.abs(bird.vy)>3){bird.vy=-bird.vy*.35;burst(bird.x,GY-4,6,'dust',2);}else{bird.vy=0;bird.spin*=.8;}}
    if(dyingT>55)gameOver();
  }else if(state==='countdown'){
    cdT-=dt;const n=Math.ceil(cdT/60);
    if(n!==lastCd&&n>0){lastCd=n;const c=$('count');c.textContent=n;c.classList.remove('tick');void c.offsetWidth;c.classList.add('tick');sfx.tick();}
    if(cdT<=0)setState('play');
  }
  for(const c of clouds){c.x-=c.v*dt*(.3+sp*.15);if(c.x<-80)c.x=LW+80;}
  bgX.far+=sp*dt*.12;bgX.city+=sp*dt*.3;bgX.bush+=sp*dt*.8;bgX.ground+=sp*dt;
}
function nightKCalc(){
  const i=Math.floor(skyPos)%4,j=(i+1)%4,f=skyPos-Math.floor(skyPos),f2=smooth(clamp((f-.6)/.4,0,1));
  return lerp(PAL[i].n,PAL[j].n,f2);
}

function medalFor(s){const t=mode==='sing'?[5,10,20,30]:[10,20,30,50];let m=0;t.forEach((v,i)=>{if(s>=v)m=i+1;});return m;}
function modeLabel(){
  if(mode==='classic')return tr('classic')+' — '+tr(DL[gameDiff]);
  if(mode==='sing')return tr('sing')+' — '+tr(SL[gameDiff]);
  return tr('custom');
}
function gameOver(){
  if(state!=='dying')return;
  setState('over');$('lives').style.display='none';
  const bk=bestKey(),isNew=score>bests[bk]&&score>0;
  if(score>bests[bk]){bests[bk]=score;store.set('best',bests);}
  $('modeTag').textContent=modeLabel();
  $('oBest').textContent=bests[bk];$('newBest').style.display=isNew?'block':'none';
  const md=$('medal'),m=medalFor(score);md.className='medal'+(m?' m'+m:'');md.textContent=m?'★':'?';
  if(m)setTimeout(()=>{if(state==='over')sfx.medal();},500);
  if(isNew){
    const cols=['#ffd23f','#ff6b6b','#7bed9f','#9be7ff','#e0c3ff'];
    for(let i=0;i<46;i++)addPart('star',rand(30,330),rand(40,200),rand(-1.2,1.2),rand(-2.2,.4),{color:cols[i%cols.length],g:.07,max:rand(60,110),size:rand(3,6)});
    buzz([30,40,30]);
  }
  showScreen('over');
  const el=$('oScore'),t0=performance.now(),dur=Math.min(900,200+score*40);
  (function cnt(){const p=clamp((performance.now()-t0)/dur,0,1);el.textContent=Math.round(score*p);if(p<1&&state==='over')requestAnimationFrame(cnt);else el.textContent=score;})();
}

const PAL=[
  {t:'#4ec0ca',b:'#cdf3f0',n:0},{t:'#7b5ea7',b:'#ff9a76',n:.35},
  {t:'#0b1026',b:'#2b3a73',n:1},{t:'#35679a',b:'#ffd6a5',n:.35}
];
const clouds=[];for(let i=0;i<7;i++)clouds.push({x:rand(0,LW),y:rand(40,250),s:rand(.6,1.3),v:rand(.15,.45)});
const stars=[];for(let i=0;i<46;i++)stars.push({x:rand(0,LW),y:rand(10,330),r:rand(.6,1.7),ph:rand(0,TAU)});
const CW=720,buildings=[];(function(){let x=0;while(x<CW){const w=rand(26,52),h=rand(40,110);buildings.push({x,w,h,seed:Math.floor(rand(0,99))});x+=w+rand(0,8);}})();

function drawSky(){
  const i=Math.floor(skyPos)%4,j=(i+1)%4,f=skyPos-Math.floor(skyPos),f2=smooth(clamp((f-.6)/.4,0,1));
  const top=mix(PAL[i].t,PAL[j].t,f2),bot=mix(PAL[i].b,PAL[j].b,f2);
  const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,top);g.addColorStop(1,bot);
  ctx.fillStyle=g;ctx.fillRect(-20,-20,LW+40,LH+40);
  if(nightK>.25){
    ctx.fillStyle='#fff';
    for(const s of stars){ctx.globalAlpha=clamp((nightK-.25)/.5,0,1)*(.5+.5*Math.sin(time*.05+s.ph));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();}
    ctx.globalAlpha=1;
  }
  const sx=LW*.76,sy=96+nightK*10,col=mix('#fff3b0','#f4f1de',nightK);
  const gl=ctx.createRadialGradient(sx,sy,4,sx,sy,60);gl.addColorStop(0,col+'cc');gl.addColorStop(1,col+'00');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(sx,sy,60,0,TAU);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(sx,sy,22,0,TAU);ctx.fill();
  if(nightK>.5){ctx.fillStyle='#d6d2bd';ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(sx-6,sy-4,4,0,TAU);ctx.arc(sx+7,sy+6,3,0,TAU);ctx.fill();ctx.globalAlpha=1;}
  const cc=mix('#ffffff','#7f8fb8',nightK);ctx.fillStyle=cc;ctx.globalAlpha=.9;
  for(const c of clouds){
    ctx.beginPath();ctx.ellipse(c.x,c.y,34*c.s,13*c.s,0,0,TAU);ctx.ellipse(c.x-20*c.s,c.y+4*c.s,20*c.s,10*c.s,0,0,TAU);ctx.ellipse(c.x+22*c.s,c.y+3*c.s,22*c.s,11*c.s,0,0,TAU);ctx.ellipse(c.x+4*c.s,c.y-9*c.s,18*c.s,11*c.s,0,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawFar(){
  ctx.fillStyle=mix('#8ed1a0','#1c3a52',nightK);
  ctx.beginPath();ctx.moveTo(0,GY);
  for(let x=0;x<=LW;x+=6){const px=x+bgX.far;ctx.lineTo(x,GY-72-Math.sin(px*.011)*20-Math.sin(px*.029)*9);}
  ctx.lineTo(LW,GY);ctx.closePath();ctx.fill();
}
function drawCity(){
  const body=mix('#9fd0d3','#18223f',nightK),off=bgX.city%CW;
  for(let rep=0;rep<2;rep++){
    for(const b of buildings){
      const x=b.x-off+rep*CW;if(x>LW||x+b.w<0)continue;
      ctx.fillStyle=body;ctx.fillRect(x,GY-b.h-4,b.w,b.h+4);
      if(nightK>.4){
        ctx.fillStyle='#ffe38a';ctx.globalAlpha=clamp((nightK-.4)*1.6,0,1);
        for(let wy=0;wy<b.h-10;wy+=12)for(let wx=5;wx<b.w-6;wx+=10)if((b.seed+Math.floor(wx/10)*7+Math.floor(wy/12)*13)%3===0)ctx.fillRect(x+wx,GY-b.h+wy,4,6);
        ctx.globalAlpha=1;
      }
    }
  }
}
function drawBushes(){
  ctx.fillStyle=mix('#4cb45a','#1d4d36',nightK);const off=bgX.bush%90;
  for(let x=-90-off;x<LW+90;x+=90){
    ctx.beginPath();ctx.arc(x+20,GY+4,18,Math.PI,0);ctx.arc(x+46,GY+4,24,Math.PI,0);ctx.arc(x+70,GY+4,16,Math.PI,0);ctx.fill();
  }
}
function drawGround(){
  ctx.fillStyle=mix('#ded895','#6c6849',nightK);ctx.fillRect(-20,GY,LW+40,LH-GY+20);
  ctx.fillStyle=mix('#73bf2e','#2b6a2a',nightK);ctx.fillRect(-20,GY,LW+40,14);
  ctx.fillStyle=mix('#9be15d','#3d8a38',nightK);ctx.fillRect(-20,GY,LW+40,4);
  ctx.fillStyle=mix('#5aa51f','#225a22',nightK);const off=bgX.ground%28;
  for(let x=-28-off;x<LW+28;x+=28){ctx.beginPath();ctx.moveTo(x,GY+4);ctx.lineTo(x+14,GY+4);ctx.lineTo(x+4,GY+14);ctx.lineTo(x-10,GY+14);ctx.closePath();ctx.fill();}
  ctx.fillStyle=mix('#c4bc7a','#575339',nightK);const o2=bgX.ground%46;
  for(let x=-46-o2;x<LW+46;x+=46){ctx.fillRect(x+10,GY+32,10,4);ctx.fillRect(x+30,GY+50,14,4);ctx.fillRect(x+4,GY+66,8,4);}
  ctx.fillStyle='#543847';ctx.fillRect(-20,GY,LW+40,2);ctx.fillRect(-20,GY+14,LW+40,2);
}
function drawPipes(){
  const sing=mode==='sing';
  for(const p of pipes){
    const top=p.c-p.gap/2,bot=p.c+p.gap/2,capH=22,ex=4;
    const pal=p.moving?['#2f5fc9','#6fa0ff','#1f3f8f']:sing?['#7a45c4','#b583f0','#4e2a85']:['#4fb01f','#9be15d','#2f7a14'];
    const gr=ctx.createLinearGradient(p.x,0,p.x+p.w,0);
    gr.addColorStop(0,pal[2]);gr.addColorStop(.22,pal[1]);gr.addColorStop(.6,pal[0]);gr.addColorStop(1,pal[2]);
    ctx.fillStyle=gr;ctx.strokeStyle='#543847';ctx.lineWidth=2.5;
    ctx.fillRect(p.x,-50,p.w,top-capH+50);ctx.strokeRect(p.x,-50,p.w,top-capH+50);
    ctx.fillRect(p.x-ex,top-capH,p.w+ex*2,capH);ctx.strokeRect(p.x-ex,top-capH,p.w+ex*2,capH);
    ctx.fillRect(p.x,bot+capH,p.w,GY-bot-capH);ctx.strokeRect(p.x,bot+capH,p.w,GY-bot-capH);
    ctx.fillRect(p.x-ex,bot,p.w+ex*2,capH);ctx.strokeRect(p.x-ex,bot,p.w+ex*2,capH);
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.fillRect(p.x+6,-50,5,top-capH+50);ctx.fillRect(p.x+6,bot+capH,5,GY-bot-capH);
    ctx.fillRect(p.x-ex+4,top-capH+3,4,capH-6);ctx.fillRect(p.x-ex+4,bot+3,4,capH-6);
    if(p.moving){
      ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('↕',p.x+p.w/2,top-capH/2);ctx.fillText('↕',p.x+p.w/2,bot+capH/2);
    }
    if(p.note){
      const cx=p.x+p.w/2,hit=Math.abs(p.x+p.w/2-bird.x)<50||p===assistT,nm=p.note.n;
      ctx.fillStyle=hit?'#ffd23f':'rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(cx,p.c,17,0,TAU);ctx.fill();
      ctx.strokeStyle='#543847';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#543847';ctx.font=(nm.length>3?'bold 11px':'bold 13px')+' system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(nm,cx,p.c+1);
    }
  }
}
function drawLadder(){
  ctx.font='bold 11px system-ui, sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
  const bm=singManual?manual.midi:(voice.active?foldMidi(voice.midi):-99);
  for(const s of POOL[(P&&P.notes)||'scale']){
    const y=midiToY(BASE+s.o),on=Math.abs(bm-(BASE+s.o))<.8;
    ctx.strokeStyle=on?'rgba(255,230,100,.9)':'rgba(255,255,255,.22)';ctx.lineWidth=on?2:1;ctx.setLineDash([6,6]);

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawAssist(){
  if(!(mode==='sing'&&P&&P.assist)||(state!=='play'&&state!=='ready'))return;
  const tp=assistT||pipes.find(p=>!p.scored&&!p.cleared);
  if(tp){
    ctx.strokeStyle='rgba(120,255,160,.95)';ctx.lineWidth=2;ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(bird.x+16,tp.c);ctx.lineTo(tp.x-4,tp.c);ctx.stroke();ctx.setLineDash([]);
  }
  if(assistT){

    ctx.fillText(tr('sing_now',{n:assistT.note.n}),LW/2,y+23,w-16);
    ctx.fillStyle='rgba(255,255,255,.18)';rr(x+14,y+42,w-28,9,4.5);ctx.fill();
    ctx.fillStyle='#7bed9f';const pw=(w-28)*clamp(assistT.hold/P.holdNeed,0,1);if(pw>1){rr(x+14,y+42,pw,9,4.5);ctx.fill();}
    ctx.fillStyle='rgba(255,255,255,.18)';rr(x+14,y+57,w-28,4,2);ctx.fill();
    ctx.fillStyle='#ffb703';const tw=(w-28)*clamp(1-assistT.wait/P.waitMax,0,1);if(tw>1){rr(x+14,y+57,tw,4,2);ctx.fill();}

function drawFog(){

function drawBird(x,y,rot,scale){

  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sx,sy);

  ctx.fillStyle='#e0a010';ctx.beginPath();ctx.moveTo(-14,-1);ctx.lineTo(-24,-6);ctx.lineTo(-21,0);ctx.lineTo(-24,6);ctx.lineTo(-14,3);ctx.closePath();ctx.fill();ctx.stroke();

  const blink=bird.blinkT<0&&bird.blinkT>-5;

  if(!blink){ctx.fillStyle='#222';ctx.beginPath();ctx.arc(9.8,-5,2.4,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(10.5,-5.9,.8,0,TAU);ctx.fill();}
  const m=bird.mouth*6;ctx.lineWidth=1.8;ctx.strokeStyle='#543847';
  ctx.fillStyle='#e8620c';ctx.beginPath();ctx.moveTo(12,3);ctx.lineTo(22,3.5+m);ctx.lineTo(12,7+m*.6);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#ff8c1a';ctx.beginPath();ctx.moveTo(12,-2);ctx.lineTo(25,1);ctx.lineTo(12,3.2);ctx.closePath();ctx.fill();ctx.stroke();

function render(){

const isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
padOn=store.get('pad',isTouch);
function localY(e){const r=cv.getBoundingClientRect();return (e.clientY-r.top)/r.height*LH;}
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,.screen.active'))return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(mode==='sing'&&singManual&&(state==='ready'||state==='play')){manual.pointer=true;manual.midi=yToMidi(localY(e));if(state==='ready')beginPlay();return;}
  if(state==='ready'||state==='play')flap();
});
stage.addEventListener('pointermove',e=>{if(manual.pointer&&singManual)manual.midi=yToMidi(localY(e));});
['pointerup','pointercancel','pointerleave'].forEach(n=>stage.addEventListener(n,()=>{manual.pointer=false;}));
const jb=$('jumpBtn');
jb.addEventListener('pointerdown',e=>{e.preventDefault();jb.classList.add('down');if(state==='ready'||state==='play')flap();});
['pointerup','pointercancel','pointerleave'].forEach(n=>jb.addEventListener(n,()=>jb.classList.remove('down')));
function holdBtn(id,key){
  const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();manual[key]=true;b.classList.add('down');if(state==='ready')beginPlay();});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>{manual[key]=false;b.classList.remove('down');}));
}
holdBtn('upBtn','up');holdBtn('downBtn','down');
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    if(state==='ready'||state==='play'){
      e.preventDefault();
      if(mode==='sing'){if(singManual){manual.up=true;if(state==='ready')beginPlay();}}
      else if(!e.repeat)flap();
    }
  }else if(e.code==='ArrowDown'||e.code==='KeyS'){
    if(mode==='sing'&&singManual&&(state==='ready'||state==='play')){e.preventDefault();manual.down=true;}
  }else if(e.code==='Escape'||e.code==='KeyP'){
    if(state==='play'||state==='ready'||state==='paused'||state==='countdown')togglePause();
  }else if(e.code==='KeyM'){toggleMute();}
  else if(e.code==='Enter'&&state==='over'){startGame(mode,gameDiff);}
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')manual.up=false;
  if(e.code==='ArrowDown'||e.code==='KeyS')manual.down=false;
});
['gesturestart','gesturechange','contextmenu'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='countdown'))togglePause();});
window.addEventListener('blur',()=>{if(state==='play'||state==='countdown')togglePause();});

function togglePause(){
  if(state==='paused'){
    showScreen(null);last=performance.now();
    if(pausedFrom==='ready')setState('ready');else{cdT=180;lastCd=0;setState('countdown');}
  }else if(state==='play'||state==='ready'){pausedFrom=state;setState('paused');showScreen('pause');}
  else if(state==='countdown'){setState('paused');showScreen('pause');}
}
function toggleMute(){muted=!muted;store.set('muted',muted);musicSync();$('btnMute').textContent=muted?'🔇':'🔊';if(!muted)sfx.click();}
function goMenu(){
  stopMic();singManual=false;manual.pointer=manual.up=manual.down=false;
  mode='classic';stage.dataset.mode='classic';pipes=[];parts=[];ev=null;assistT=null;
  setState('menu');showScreen('menu');refreshRecords();$('banner').classList.remove('show');
  $('lives').style.display='none';
  bird.x=LW/2;sfxOn=true;musicBlock=false;musicSync();updatePad();
}
function refreshRecords(){
  const b=bests;
  $('records').innerHTML='🏆 '+tr('records')+'<br>'+tr('m_classic')+' 🌱'+b.classic_facile+' ⚡'+b.classic_normal+' 🔥'+b.classic_difficile+
    '<br>'+tr('m_custom')+' '+b.custom+' · '+tr('m_sing')+' 🌱'+b.sing_facile+' 🎤'+b.sing_normal+' 🎭'+b.sing_opera;
}
function refreshDiffRecords(){document.querySelectorAll('#diffc [data-rec]').forEach(s=>s.textContent='🏆 '+(bests[s.dataset.rec]||0));}

/* Niveaux du Chant */
function buildSingLvl(){
  const box=$('singLvl');box.innerHTML='';
  SING_LVL.forEach(l=>{
    const b=document.createElement('button');b.type='button';b.className='lchip';b.dataset.id=l.id;b.textContent=tr(l.l);
    b.addEventListener('click',()=>{singDiff=l.id;store.set('ds',singDiff);refreshSingLvl();sfx.click();});
    box.appendChild(b);
  });
  refreshSingLvl();
}
function refreshSingLvl(){
  document.querySelectorAll('.lchip').forEach(c=>c.classList.toggle('on',c.dataset.id===singDiff));
  const l=SING_LVL.find(x=>x.id===singDiff);$('lvlDesc').textContent=l?tr(l.d):'';
}

/* Micro : messages traduisibles */
let micKey='mic_idle',micBtnKey='mic_btn';
function setMic(k){micKey=k;$('micStatus').textContent=tr(k);}
function setMicBtn(k){micBtnKey=k;$('bMic').textContent=tr(k);}

/* ============ Langue ============ */
function buildLangGrid(){
  const box=$('langGrid');box.innerHTML='';
  Object.keys(LANGS).forEach(code=>{
    const b=document.createElement('button');b.type='button';b.className='langbtn'+(code===LANG?' on':'');
    b.dataset.code=code;b.textContent=LANGS[code].flag+' '+LANGS[code].name;
    b.addEventListener('click',()=>setLang(code));
    box.appendChild(b);
  });
}
function applyLang(){
  document.documentElement.lang=LANG;
  NOTE_NAMES=LANGS[LANG].notes;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=tr(el.dataset.t);});
  buildSettingsUI();buildSingLvl();buildLangGrid();refreshRecords();refreshDiffRecords();
  setMic(micKey);setMicBtn(micBtnKey);setHint();
  if(screenActive('tuto'))renderTuto();else $('tNext').textContent=tr('next');
  if(state==='over')$('modeTag').textContent=modeLabel();
}
function setLang(code){
  if(!LANGS[code])return;
  LANG=code;store.set('lang',code);applyLang();sfx.click();
}

/* ============ Boutons ============ */
$('bClassic').onclick=()=>{sfx.click();refreshDiffRecords();showScreen('diffc');};
document.querySelectorAll('#diffc .dbtn').forEach(b=>b.addEventListener('click',()=>{sfx.click();classicDiff=b.dataset.d;store.set('dc',classicDiff);startGame('classic',classicDiff);}));
$('bDiffBack').onclick=()=>{sfx.click();showScreen('menu');};
$('bCustom').onclick=()=>{sfx.click();startGame('custom');};
$('bSing').onclick=()=>{sfx.click();setState('menu');musicBlock=true;musicSync();refreshSingLvl();showScreen('setup');
  setMic(mic.on?'mic_ok':'mic_idle');$('bSingGo').disabled=!mic.on;setMicBtn(mic.on?'mic_on_btn':'mic_btn');};
$('bSettings').onclick=()=>{sfx.click();refreshSettingsUI();showScreen('settings');};
$('bSetBack').onclick=()=>{sfx.click();showScreen('menu');};
$('bLang').onclick=()=>{sfx.click();buildLangGrid();showScreen('lang');};
$('bLangBack').onclick=()=>{sfx.click();showScreen('menu');};
$('bReset').onclick=()=>{cfg=defaultsCfg();store.set('cfg',cfg);buildSettingsUI();sfx.click();};
$('bMic').onclick=async()=>{
  ac();setMic('mic_wait');
  try{await startMic();setMic('mic_ok');$('bSingGo').disabled=false;setMicBtn('mic_on_btn');}
  catch(err){
    const name=err&&err.name;
    setMic(name==='NotAllowedError'?'mic_denied':(err&&err.message==='unsupported')?'mic_unsup':'mic_none');
  }
};
$('bSingGo').onclick=()=>{singManual=false;startGame('sing',singDiff);};
$('bSingManual').onclick=()=>{singManual=true;manual.midi=BASE+5;startGame('sing',singDiff);};
$('bSingBack').onclick=()=>{musicBlock=false;musicSync();stopMic();setMicBtn('mic_btn');$('bSingGo').disabled=true;showScreen('menu');};
$('bRetry').onclick=()=>{sfx.click();startGame(mode,gameDiff);};
$('bOverMenu').onclick=()=>{sfx.click();goMenu();};
$('btnPause').onclick=()=>togglePause();
$('btnMute').onclick=toggleMute;$('btnMusic').onclick=toggleMusic;
$('btnPad').onclick=()=>{padOn=!padOn;store.set('pad',padOn);updatePad();toast(tr(padOn?'pad_on':'pad_off'));};
$('btnFs').onclick=()=>{
  const d=document,el=d.documentElement;
  try{if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
  else{(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}}catch(e){}
};
$('bResume').onclick=()=>togglePause();
$('bPauseMenu').onclick=()=>goMenu();

/* ============ Tutoriel ============ */
function ladderHTML(){let h='';SCALE.forEach((s,i)=>{const y=225-i*28.5;h+=`<div class="ln" style="top:calc(${y}*var(--u))"></div><div class="lb" style="top:calc(${y}*var(--u))">${s.n}</div>`;});return h;}
const TUTO=[
 {t:'t1',x:'x1',d:()=>ladderHTML()+'<div class="bd s1">🐦</div><div class="mic">🎤</div><div class="tag">'+tr('tag1')+'</div>'},
 {t:'t2',x:'x2',d:()=>'<div class="bd s2">🐦</div><div class="pp"><div class="pt"></div><div class="pb"></div><div class="bub">'+SCALE[4].n+'</div></div><div class="tag">'+tr('tag2',{n:SCALE[4].n})+'</div>'},
 {t:'t3',x:'x3',d:()=>'<div class="bd s3">🐦</div><div class="mic">🎤</div><div class="tag t1">'+tr('tag3a')+'</div><div class="tag t2">'+tr('tag3b')+'</div>'},
 {t:'t4',x:'x4',d:()=>'<div class="tips"><div>'+tr('tip_l1')+'</div><div>'+tr('tip_l2')+'</div><div>'+tr('tip_l3')+'</div></div>'},
 {t:'t5',x:'x5',d:()=>'<div class="tips"><div>'+tr('tip_a1')+'</div><div>'+tr('tip_a2')+'</div><div>'+tr('tip_a3')+'</div><div>'+tr('tip_a4')+'</div></div>'}
];
let tIdx=0,tFrom='menu';
function renderTuto(){
  const T=TUTO[tIdx];
  $('tTitle').textContent=tr(T.t);$('tDemo').innerHTML=T.d();$('tText').textContent=tr(T.x);
  $('tDots').innerHTML=TUTO.map((_,i)=>'<i class="'+(i===tIdx?'on':'')+'"></i>').join('');
  $('tPrev').style.visibility=tIdx===0?'hidden':'visible';
  $('tNext').textContent=tIdx===TUTO.length-1?tr('try'):tr('next');
}
function openTuto(from){
  tFrom=from;tIdx=0;renderTuto();showScreen('tuto');
  store.set('tutoSeen',true);$('bTuto').classList.remove('attn');
}
function closeTuto(){showScreen(tFrom==='setup'?'setup':'menu');}
$('bTuto').onclick=()=>{sfx.click();openTuto('menu');};
$('bSetupTuto').onclick=()=>{sfx.click();openTuto('setup');};
$('tPrev').onclick=()=>{sfx.click();if(tIdx>0){tIdx--;renderTuto();}};
$('tNext').onclick=()=>{
  sfx.click();
  if(tIdx<TUTO.length-1){tIdx++;renderTuto();}
  else{$('bSing').onclick();}
};
$('tClose').onclick=()=>{sfx.click();closeTuto();};

/* ============ Redimensionnement & init ============ */
function resize(){
  const vv=window.visualViewport,vw=vv?vv.width:window.innerWidth,vh=vv?vv.height:window.innerHeight;
  const s=Math.min(vw/LW,vh/LH),w=Math.floor(LW*s),h=Math.floor(LH*s),dpr=Math.min(window.devicePixelRatio||1,2);
  stage.style.width=w+'px';stage.style.height=h+'px';stage.style.setProperty('--u',(w/LW)+'px');
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,150));
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);

(function init(){
  const t=$('titleEl');'FLAPPY BIRD'.split('').forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch===' '?'\u00a0':ch;s.style.animationDelay=(i*.09)+'s';t.appendChild(s);});
  $('btnMute').textContent=muted?'🔇':'🔊';updateMusicBtn();updatePad();
  if(document.fullscreenEnabled||document.webkitFullscreenEnabled)$('btnFs').style.display='flex';
  if(!store.get('tutoSeen',false))$('bTuto').classList.add('attn');
  applyLang();resize();
  bird.blinkT=100;
  requestAnimationFrame(tick);
})();
})();
</script>

  });
}
